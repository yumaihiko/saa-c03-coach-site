<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="SAA-C03 彩色記憶卡：陷阱、易誤會、正解、口訣。">
<title>記憶卡 · 證書人 SAA-C03</title>
<style>
  :root {
    --bg:#0b1220; --panel:#111827; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8;
    --yellow:#fde68a; --red:#fca5a5; --green:#86efac; --blue:#93c5fd; --accent:#38bdf8;
    --border:#334155;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:rgba(17,24,39,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .in{max-width:920px;margin:0 auto;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  h1{font-size:1.05rem;margin:0;flex:1}
  h1 span{color:var(--accent)}
  .btn{border:1px solid var(--border);background:#1e293b;color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.on{background:#0ea5e9;border-color:#0ea5e9;color:#06202b;font-weight:700}
  main{max-width:920px;margin:0 auto;padding:14px 14px 80px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px;font-size:.82rem;color:var(--muted)}
  .legend i{font-style:normal;padding:2px 8px;border-radius:999px;background:#1e293b}
  .legend .y{color:var(--yellow)}.legend .r{color:var(--red)}.legend .g{color:var(--green)}.legend .b{color:var(--blue)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .tabs .btn{white-space:nowrap;flex:0 0 auto}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#0f172a;color:var(--text);font:inherit;margin-bottom:14px}
  .meta{color:var(--muted);font-size:.9rem;margin:0 0 12px}
  .grid{display:grid;gap:12px}
  .mc{background:var(--card);border-radius:14px;padding:14px 14px 12px;border-left:5px solid var(--accent);box-shadow:0 1px 0 rgba(255,255,255,.03)}
  .mc:nth-child(4n+1){border-left-color:#f87171}
  .mc:nth-child(4n+2){border-left-color:#34d399}
  .mc:nth-child(4n+3){border-left-color:#60a5fa}
  .mc:nth-child(4n+4){border-left-color:#fbbf24}
  .k{color:var(--yellow);font-weight:700;font-size:1.02rem;margin:0 0 8px}
  .row{margin:0 0 6px;font-size:.95rem}
  .lbl{display:inline-block;min-width:4.8em;color:var(--muted);font-size:.8rem}
  .wrong{color:var(--red)}.right{color:var(--green)}.tip{color:var(--blue);font-weight:600}
  footer{max-width:920px;margin:0 auto;padding:8px 14px 28px;color:var(--muted);font-size:.8rem}
  .empty{padding:28px;text-align:center;color:var(--muted);background:#111827;border-radius:14px}
</style>
</head>
<body>
<header>
  <div class="in">
    <h1>記憶卡 · AWS <span>SAA-C03</span></h1>
    <a class="btn" href="./">回溫書站</a>
  </div>
</header>
<main>
  <div class="legend">
    <i class="y">黃＝關鍵／陷阱</i>
    <i class="r">紅＝易誤會</i>
    <i class="g">綠＝正解</i>
    <i class="b">藍＝一句記</i>
  </div>
  <div class="tabs" id="tabs"></div>
  <input class="search" id="q" type="search" placeholder="搜尋：例如 ONTAP、Macie、FIFO…" enterkeyhint="search">
  <p class="meta" id="meta"></p>
  <div class="grid" id="grid"></div>
</main>
<footer>
  整理自 <a href="https://github.com/RonitSachdev/aws-saa-c03-guides" rel="noopener">RonitSachdev/aws-saa-c03-guides</a>（CC BY 4.0）＋你的 Dojo 錯題重點。
  非官方，與 AWS 無隸屬。
</footer>
<script src="js/memory-data.js"></script>
<script>
(() => {
  const tabs = document.getElementById("tabs");
  const grid = document.getElementById("grid");
  const meta = document.getElementById("meta");
  const q = document.getElementById("q");
  let sheetId = (location.hash || "#A").slice(1).toUpperCase();
  if (!MEMORY_SHEETS.some(s => s.id === sheetId)) sheetId = "A";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  function renderTabs() {
    tabs.innerHTML = MEMORY_SHEETS.map(s =>
      `<button class="btn ${s.id===sheetId?"on":""}" data-id="${s.id}">${esc(s.title.zh)}</button>`
    ).join("");
    tabs.querySelectorAll("button").forEach(b => b.onclick = () => {
      sheetId = b.dataset.id;
      history.replaceState(null, "", "#" + sheetId);
      renderTabs(); render();
    });
  }

  function render() {
    const sheet = MEMORY_SHEETS.find(s => s.id === sheetId);
    const term = q.value.trim().toLowerCase();
    const items = sheet.items.filter(it => !term || it.join(" ").toLowerCase().includes(term));
    meta.textContent = `${sheet.title.zh} · ${sheet.blurb.zh} · 顯示 ${items.length}/${sheet.items.length}`;
    if (!items.length) {
      grid.innerHTML = `<div class="empty">無符合「${esc(q.value)}」</div>`;
      return;
    }
    grid.innerHTML = items.map(([k,w,r,t]) => `
      <article class="mc">
        <p class="k">${esc(k)}</p>
        <p class="row"><span class="lbl">易誤會</span><span class="wrong">${esc(w)}</span></p>
        <p class="row"><span class="lbl">正解</span><span class="right">${esc(r)}</span></p>
        <p class="row"><span class="lbl">一句記</span><span class="tip">${esc(t)}</span></p>
      </article>`).join("");
  }

  q.addEventListener("input", render);
  window.addEventListener("hashchange", () => {
    sheetId = (location.hash || "#A").slice(1).toUpperCase();
    if (!MEMORY_SHEETS.some(s => s.id === sheetId)) sheetId = "A";
    renderTabs(); render();
  });
  renderTabs(); render();
})();
</script>
</body>
</html>
